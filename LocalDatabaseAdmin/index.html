<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinerNotes 本地数据库录入端</title>
<style>
:root{--pink:#ff2d55;--bg:#f7f7f8;--card:#fff;--text:#151518;--muted:#6e6e73;--line:#e5e5ea}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:2;background:rgba(247,247,248,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:16px 22px}h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 73px)}nav{border-right:1px solid var(--line);padding:16px;background:#fbfbfc}.tab{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;font-size:16px;cursor:pointer}.tab.active{background:var(--pink);color:white;font-weight:700}main{padding:22px;display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.04)}h2{margin:0 0 14px;font-size:20px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white;font-size:14px}textarea{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}button.primary{background:var(--pink);color:white;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#eeeef0;color:#222;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:10px}.title{font-weight:700}.meta{color:var(--muted);font-size:13px;margin-top:3px}.mini{font-size:12px;color:var(--muted)}.danger{color:#b00020}.search{margin-bottom:12px}.pill{display:inline-block;background:#f1f1f3;border-radius:999px;padding:3px 8px;font-size:12px;color:#555;margin-top:6px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}@media(max-width:900px){.wrap{grid-template-columns:1fr}nav{display:flex;gap:8px;overflow:auto}.tab{white-space:nowrap}main{grid-template-columns:1fr}}
</style></head><body><header><h1>LinerNotes 本地数据库录入端</h1><div class="sub">录入 artists / albums / songs / samples，自动保存到 LocalDatabaseAdmin/database.json</div></header><div class="wrap"><nav id="tabs"></nav><main><section class="card"><h2 id="formTitle"></h2><form id="form"></form><div class="actions"><button class="primary" id="save">保存</button><button class="secondary" id="reset">新建 / 清空</button></div></section><section class="card"><div class="toolbar"><h2 id="listTitle"></h2><button class="secondary" id="download">下载 JSON</button></div><input class="search" id="q" placeholder="搜索当前表..."><div class="list" id="list"></div></section></main></div><script src="app.js"></script></body></html>
